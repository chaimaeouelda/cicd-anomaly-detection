name: Security Gate (anomaly detection)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  anomaly-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker compose build

      - name: Entrainement des modeles
        run: |
          for m in features train_autoencoder train_iforest compare_scores tune_hybrid; do
            docker compose run --rm ml python -m src.$m
          done

      - name: Demarrage de l'API
        run: |
          docker compose up -d api
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Gate - pipeline normal (doit passer)
        run: python3 scripts/gate.py samples/normal.json

      - name: Gate - pipeline suspect (doit etre bloque)
        run: |
          if python3 scripts/gate.py samples/suspicious.json; then
            echo "ERREUR : le pipeline suspect n'a pas ete bloque"
            exit 1
          else
            echo "OK : pipeline suspect bloque comme attendu"
          fi

      - name: E2E - executions inconnues (ALLOW / BLOCK)
        run: |
          mkdir -p reports/04-e2e
          python3 scripts/e2e_run.py --url http://localhost:8000/predict --report reports/04-e2e/e2e_report.json

      - name: Tests pytest
        run: docker compose run --rm -e API_URL=http://api:8000 ml pytest -q tests

      - name: Archivage du rapport E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: reports/04-e2e/e2e_report.json
          if-no-files-found: ignore

      - name: Logs de l'API en cas d'echec
        if: failure()
        run: docker compose logs api
